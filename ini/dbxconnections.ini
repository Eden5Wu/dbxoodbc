; =============================================================================
; Open DBX4 ODBC Driver Remastered (dbx4odbc) - Connection Profiles Template
; Version: 4.2026.11.11
; =============================================================================
; You can copy any of these sample connection profiles into your
; dbxconnections.ini (or load them via TSQLConnection.LoadParamsFromIniFile).
;
; Both native ODBC connection strings (Driver={...};) and ADO/OLEDB style
; connection strings (Provider=...;) are automatically supported!
; =============================================================================

[MSSQL_Native_ODBC]
DriverName=DbxOpenOdbc
ConnectionString=Driver={SQL Server};Server=127.0.0.1;Database=master;Uid=sa;Pwd=secret;APP=MyDelphiApp;WSID=DEV_PC01;
Database=?
SchemaOverride=%.dbo
RowsetSize=20
BlobSize=-1
Trim Char=True

[MSSQL_ADO_Style]
DriverName=DbxOpenOdbc
ConnectionString=Provider=SQLOLEDB;Data Source=127.0.0.1;Initial Catalog=master;User ID=sa;Password=secret;Application Name=MyDelphiApp;Workstation ID=DEV_PC01;
Database=?
SchemaOverride=%.dbo
RowsetSize=20
BlobSize=-1
Trim Char=True

[MSSQL_Windows_Auth]
DriverName=DbxOpenOdbc
ConnectionString=Provider=MSOLEDBSQL;Data Source=127.0.0.1;Initial Catalog=master;Integrated Security=SSPI;Application_Name=MyDelphiApp;TrustServerCertificate=yes;
Database=?
SchemaOverride=%.dbo
RowsetSize=20
BlobSize=-1
Trim Char=True

[MSAccess_Demo]
DriverName=DbxOpenOdbc
ConnectionString=DRIVER={Microsoft Access Driver (*.mdb, *.accdb)};DBQ=demos\dbms\msaccess\sql\dbdemos.mdb;ReadOnly=0;
Database=?
RowsetSize=20
BlobSize=-1
Trim Char=True

[SQLite_ODBC]
DriverName=DbxOpenOdbc
ConnectionString=DRIVER={SQLite3 ODBC Driver};Database=demos\dbms\sqlite\sql\dbdemos.db;
Database=?
RowsetSize=20
BlobSize=-1
Trim Char=True

[PostgreSQL_ODBC]
DriverName=DbxOpenOdbc
ConnectionString=DRIVER={PostgreSQL Unicode};Server=127.0.0.1;Port=5432;Database=postgres;Uid=postgres;Pwd=secret;
Database=?
RowsetSize=20
BlobSize=-1
Trim Char=True
