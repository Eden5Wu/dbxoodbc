; Delphi Data Access Benchmark Configuration Template
; Copy this file to bench_config.ini in the same directory and customize for your environment.

[Database]
Server=127.0.0.1
Database=YourDatabaseName
User=sa
Password=YourStrongPassword
ODBCDriver=ODBC Driver 17 for SQL Server
OLEDBProvider=SQLOLEDB

[Scenarios]
; Number of rows to generate for synthetic scalar benchmark (Scenario 1)
ScalarRowCount=5000

; Optional table names for enterprise scenarios (Scenarios 2 - 5)
; Leave blank or customize with your own tables.
; If these tables do not exist in your database, these scenarios will be skipped gracefully.
MultiMemoTable=dbo.YourMultiMemoTable
WideTable=dbo.YourWideTable
BlobTable=dbo.YourBlobTable
