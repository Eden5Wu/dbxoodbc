; Data Explorer driver settings. Filename below is the Delphi 11 / suffix 280 example.
; Change 280 to the LIB suffix used when building your package; see ../README.md.
; Merge into the IDE's INI; do not overwrite its other drivers.
; Replace the BPL filename in DriverPackageLoader with its actual absolute path
; unless its directory is already on the IDE's DLL/package search path.
; See ../README.md or ../README_TW.md for build and removal instructions.

[Installed Drivers]
DbxOpenOdbc=1
OpenOdbc=1

[DbxOpenOdbc]
DriverUnit=DbxOpenOdbcDriver
DriverPackageLoader=TDBXOpenOdbcDriverLoaderNative,DbxOpenOdbcDataExplorer280.bpl
Database=?
User_Name=
Password=
RowsetSize=20
BlobSize=-1
Trim Char=True

[OpenOdbc]
DriverUnit=DbxOpenOdbcDriver
DriverPackageLoader=TDBXOpenOdbcDriverLoaderNative,DbxOpenOdbcDataExplorer280.bpl
Database=?
User_Name=
Password=
RowsetSize=20
BlobSize=-1
Trim Char=True
