; Optional example connection for Data Explorer. Merge; do not overwrite.
; Edit ConnectionString for your server/database and installed Win32 ODBC driver.
; This example uses Windows authentication; no SQL Server password is supplied.

[DbxOpenOdbc_DataExplorer_MSSQL]
DriverName=DbxOpenOdbc
ConnectionString=Driver={SQL Server};Server=localhost;Database=master;Trusted_Connection=yes;APP=DbxOpenOdbcDataExplorer;
Database=?
SchemaOverride=%.dbo
RowsetSize=20
BlobSize=-1
Trim Char=True
