; =============================================================================
; Open DBX4 ODBC Driver Remastered (dbx4odbc) - Driver Registration Template
; Version: 4.2026.11.10
; =============================================================================
; Note:
;   For pure runtime applications, you do NOT need this file! Simply add
;   "uses DbxOpenOdbcDriver;" to your project and set DriverName := 'DbxOpenOdbc'.
;
;   If you want to register DbxOpenOdbc in RAD Studio's dbxdrivers.ini
;   (Located at: C:\Users\Public\Documents\Embarcadero\Studio\dbExpress\<Version>\dbxdrivers.ini),
;   append the sections below to your dbxdrivers.ini:
; =============================================================================

[Installed Drivers]
DbxOpenOdbc=1
OpenOdbc=1

[DbxOpenOdbc]
DriverUnit=DbxOpenOdbcDriver
DriverPackageLoader=TDBXOpenOdbcDriverLoaderNative
ConnectionString=DRIVER={SQL Server};Server=127.0.0.1;Database=master;Trusted_Connection=yes;
Database=?
SchemaOverride=%.dbo
User_Name=
Password=
RowsetSize=20
BlobSize=-1
Trim Char=True
Custom String=

[OpenOdbc]
DriverUnit=DbxOpenOdbcDriver
DriverPackageLoader=TDBXOpenOdbcDriverLoaderNative
ConnectionString=DRIVER={Microsoft Access Driver (*.mdb, *.accdb)};DBQ=dbdemos.mdb;
Database=?
User_Name=
Password=
RowsetSize=20
BlobSize=-1
Trim Char=True
Custom String=
